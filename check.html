<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>查題校對｜統測英文題庫</title>
  <link rel="icon" href="favicon.svg?v=20260802-v1" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=20260802-v1">
  <script defer src="data/exams.js?v=20260802-v1"></script>
  <script defer src="data/questions.js?v=20260802-v2"></script>
  <script type="module" src="check.js?v=20260802-v2"></script>
</head>
<body>
  <a class="skip-link" href="#mainContent">跳到查題工具</a>
  <header class="compact-header">
    <nav><a class="brand" href="./">← 統測英文題庫</a></nav>
    <h1>查題校對</h1>
    <p>輸入學年度與題號，單獨核對官方答案。</p>
  </header>
  <main id="mainContent" class="narrow">
    <section class="panel checker">
      <form id="checkForm" class="control-row">
        <label>學年度<select id="checkYear"></select></label>
        <label>題號<input id="checkNo" type="number" min="1" inputmode="numeric" value="1" aria-describedby="checkError"></label>
        <button id="checkButton" class="primary" type="submit">顯示答案</button>
      </form>
      <p id="checkError" class="form-error" role="alert" hidden></p>
      <div id="checkResult" class="result" tabindex="-1" hidden aria-live="polite"></div>
      <div class="paper-actions">
        <a id="checkQuestionLink" class="button-link" target="_blank" rel="noopener">開啟官方題本</a>
        <a id="checkAnswerLink" class="button-link secondary" target="_blank" rel="noopener">查看官方答案原檔</a>
      </div>
    </section>
  </main>
</body>
</html>
